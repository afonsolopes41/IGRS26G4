#!KAMAILIO
# ConferenceControl 2.0 — IGRS 2026/27 Grupo 4
# Baseado no app.cfg do Laboratório 5 (Kamailio + KEMI Python + Redis + SEMS).
# Aqui só se carregam módulos e parâmetros; a lógica está em app.py (KEMI).

####### Global Parameters #########
debug=2
log_stderror=yes
fork=yes
children=4
listen=udp:eth0:5060

####### Modules Section ########
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

loadmodule "tm"
loadmodule "tmx"
loadmodule "rr"
loadmodule "usrloc"
loadmodule "registrar"
loadmodule "kex"
loadmodule "jsonrpcs"
loadmodule "ctl"
loadmodule "kemix"
loadmodule "sl"
loadmodule "pv"
loadmodule "uac"
loadmodule "maxfwd"
loadmodule "siputils"
loadmodule "textops"
loadmodule "htable"
loadmodule "app_python3"

modparam("usrloc", "preload", "location")
modparam("uac", "reg_contact_addr", "127.0.0.1:5060")

# Estado partilhado entre processos (variáveis Python NÃO são partilhadas)
modparam("htable", "htable", "room=>size=4;")      # estado das salas (US7)
modparam("htable", "htable", "pending=>size=6;")   # pedidos à sala de equipa (US9/US10)
modparam("htable", "htable", "kpi=>size=6;")       # KPIs não persistentes (US11)
modparam("htable", "htable", "valid=>size=6;")     # utilizadores validados por PIN (US4)
# KPIs persistentes (US14): Redis, como no Lab 5 (aux_classes.RedisDB)

modparam("app_python3", "load", "/etc/kamailio/app.py")
cfgengine "python"
